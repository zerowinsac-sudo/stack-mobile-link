<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S.T.A.C.K</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#0a1018;color:#e9f2ff;font-family:system-ui;text-align:center}main{max-width:28rem;padding:2rem}h1{color:#78c6ff}</style><main><h1>S.T.A.C.K</h1><p id="status">Verbindung wird geprüft …</p></main><script>(async()=>{try{const remote=await fetch("remote.json?"+Date.now()).then(r=>r.json());if(remote.url)location.replace(remote.url);else document.querySelector("#status").textContent="STACK ist gerade nicht gestartet."}catch{document.querySelector("#status").textContent="STACK-Verbindung ist gerade nicht verfügbar."}})();</script></html>
